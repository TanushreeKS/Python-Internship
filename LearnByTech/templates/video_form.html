<!DOCTYPE html>
<html>
<head>
    <title>Add Video</title>
</head>
<body>

<h2>Add Video</h2>

<form method="POST">
    <input name="title" placeholder="Video Title"><br><br>
    <input name="url" placeholder="Video URL"><br><br>

    <!-- 🔥 DROPDOWN -->
    <select name="course_id">
        <option value="">Select Course</option>
        {% for course in courses %}
            <option value="{{ course.id }}">
                {{ course.title }}
            </option>
        {% endfor %}
    </select><br><br>

    <button type="submit">Add Video</button>
</form>

<br>
<a href="/videos">Back</a>

</body>
</html>
