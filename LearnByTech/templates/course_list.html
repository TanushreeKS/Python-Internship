{% extends 'base.html' %}

{% block content %}

<h2>Courses</h2>

{% for course in courses %}
    <div class="card">
        <h3>{{ course.title }}</h3>
        <p>{{ course.description }}</p>

        <a class="btn" href="/course/{{ course.id }}">View</a>
        <a class="btn" href="/enroll/{{ course.id }}">Enroll</a>
    </div>
{% endfor %}

{% endblock %}
